# Chatex site: the Angular app from disk, /api, /hubs and /health proxied to Kestrel.
# Install: cp deploy/nginx/chatex.conf /etc/nginx/sites-available/chatex
#          ln -s /etc/nginx/sites-available/chatex /etc/nginx/sites-enabled/chatex
#          replace chat.example.com, then: nginx -t && systemctl reload nginx
#          certbot --nginx -d chat.example.com   (adds the TLS server block and the redirect)

upstream chatex_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# WebSocket upgrade for SignalR; plain keep-alive for everything else.
map $http_upgrade $chatex_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    root /opt/chatex/current/web;
    index index.html;

    # Attachments are limited to 20 MB by default (Attachments:MaxBytes); leave room for the form.
    client_max_body_size 25m;

    location ^~ /api/ {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ^~ /hubs/ {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chatex_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        access_log off;
    }

    # Hashed build output (outputHashing: all) never changes under the same name.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must always be revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
