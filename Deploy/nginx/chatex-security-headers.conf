# Security headers for the Chatex site, included by chatex.conf at server level and again in every location that
# sets its own add_header (Nginx drops inherited add_header directives in such locations).
# Install: cp Deploy/nginx/chatex-security-headers.conf /etc/nginx/snippets/
#
# CSP: scripts only from this origin (the theme script is the file theme-init.js, not inline); inline styles are
# allowed because Angular injects component styles as <style> elements; images may be blob: URLs (avatars and
# attachments fetched with the bearer token) or data: URLs; 'self' in connect-src also covers the same-origin
# wss:// connection of SignalR.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
