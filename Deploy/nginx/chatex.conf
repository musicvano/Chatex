# Chatex site: the Angular app from disk, /api, /hubs and /health proxied to Kestrel.
# Install: cp Deploy/nginx/chatex.conf /etc/nginx/sites-available/chatex
#          cp Deploy/nginx/chatex-security-headers.conf /etc/nginx/snippets/
#          ln -s /etc/nginx/sites-available/chatex /etc/nginx/sites-enabled/chatex
#          nginx -t && systemctl reload nginx   (server_name is chatex.mvano.com; change it for another domain)
#          certbot --nginx -d chatex.mvano.com   (adds the TLS server block and the redirect)

upstream chatex_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# WebSocket upgrade for SignalR; plain keep-alive for everything else.
map $http_upgrade $chatex_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name chatex.mvano.com;

    root /opt/chatex/current/web;
    index index.html;

    # Attachments are limited to 20 MB by default (Attachments:MaxBytes); leave room for the form.
    client_max_body_size 25m;

    include snippets/chatex-security-headers.conf;

    # Text responses from disk and from the API (index.html is always compressed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/problem+json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ^~ /hubs/ {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chatex_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # The API only answers the hosts in AllowedHosts, so pass the real Host on here too.
    location = /health {
        proxy_pass http://chatex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        access_log off;
    }

    # Hashed build output (outputHashing: all) never changes under the same name: main-IWEIRFGV.js, media/...
    location ~* "-[a-z0-9_-]{8}\.(?:js|css)$" {
        include snippets/chatex-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        include snippets/chatex-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, SPA routes, favicons, site.webmanifest, theme-init.js) is revalidated on every load.
    location / {
        include snippets/chatex-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
