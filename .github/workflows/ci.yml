# Build, lint and test the backend and the frontend.
# Runs on pull requests and pushes to dev; deploy.yml calls it before every production deploy.
name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from deploy.yml, github.workflow is the caller's name, so the groups never collide.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore Chatex.slnx
          dotnet tool restore

      - name: Check formatting
        run: dotnet format Chatex.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Chatex.slnx -c Release --no-restore

      - name: Check for model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project Chatex.DataAccess --configuration Release --no-build

      # Testcontainers starts PostgreSQL in the runner's Docker.
      - name: Test
        run: dotnet test --solution Chatex.slnx -c Release --no-build

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Chatex.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Chatex.Web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
