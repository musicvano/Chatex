# Weekly dependency updates as pull requests to dev; minor and patch bumps are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    # These packages version with .NET itself; their major bumps come with a deliberate upgrade
    # of the SDK in global.json and the target framework, not one package at a time.
    ignore:
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.EntityFrameworkCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
        update-types: [version-update:semver-major]
      - dependency-name: EFCore.NamingConventions
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /Source/Chatex.Web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
