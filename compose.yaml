# Local PostgreSQL for development: docker compose up -d
# Matches the connection string in Source/Chatex.Api/appsettings.Development.json and the dotnet-ef default.
name: chatex

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chatex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
